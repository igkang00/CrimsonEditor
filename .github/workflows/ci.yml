# Build and test on pull requests to main and on pushes to main, each in one flavour:
#
#   pull request  ->  Debug:   Debug-KR, Debug-US, the helper tools, and the Debug unit tests
#   push to main  ->  Release: Release-KR, Release-US, the helper tools, and the Release unit tests
#
# A change is checked in Debug before it merges and in Release once it has, so the same code is
# never built twice. The price: something that breaks only in Release (an optimiser-only warning,
# now an error) is found after the merge, as a red run on main -- still before any release,
# since release.yml builds the installer from Release.
#
# The runner image is pinned (not windows-latest) so a GitHub image rollover cannot change the
# toolset under us: the projects need Visual Studio 2026's v145 toolset with MFC, which this
# image carries. All projects treat warnings as errors, so a new warning fails the run.
#
# Cost: free. Standard GitHub-hosted runners are free for public repositories.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:        # run the main-branch (Release) checks by hand

# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Debug for pull requests, Release for everything else (push to main, manual runs).
  FLAVOUR: ${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }}

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        config: ${{ github.event_name == 'pull_request' && fromJSON('["Debug-KR", "Debug-US"]') || fromJSON('["Release-KR", "Release-US"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build cedt (${{ matrix.config }})
        run: msbuild cedt.vcxproj /p:Configuration=${{ matrix.config }} /p:Platform=x64 /m /nologo /v:minimal

      - name: Upload the executable
        if: startsWith(matrix.config, 'Release-')
        uses: actions/upload-artifact@v4
        with:
          name: cedt-${{ matrix.config }}
          path: build/x64/${{ matrix.config }}/cedt_*.exe
          retention-days: 7

  tools:
    name: Build launcher and shell extension (${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }})
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build launch.exe
        run: msbuild tools/launch/launch.vcxproj /p:Configuration=${{ env.FLAVOUR }} /p:Platform=x64 /nologo /v:minimal

      - name: Build ShellExt.dll
        run: msbuild tools/shellext/shellext.vcxproj /p:Configuration=${{ env.FLAVOUR }} /p:Platform=x64 /nologo /v:minimal

  test:
    name: Unit tests (${{ github.event_name == 'pull_request' && 'Debug' || 'Release' }})
    runs-on: windows-2025-vs2026
    env:
      # gtest comes from vcpkg in manifest mode (tests/vcpkg.json). Building it takes minutes;
      # the binary cache keeps it across runs.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ env.FLAVOUR }}-${{ hashFiles('tests/vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ env.FLAVOUR }}-

      - name: Hook vcpkg into MSBuild
        shell: pwsh
        run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install'

      - name: Build cedt_tests (${{ env.FLAVOUR }})
        run: msbuild tests/cedt_tests.vcxproj /p:Configuration=${{ env.FLAVOUR }} /p:Platform=x64 /m /nologo /v:minimal

      - name: Run cedt_tests
        run: tests\build\x64\${{ env.FLAVOUR }}\cedt_tests.exe --gtest_output=xml:test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.FLAVOUR }}
          path: test-results.xml
          retention-days: 7
